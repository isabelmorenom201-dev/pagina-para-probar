
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Una preguntita preguntosa...</title>

    <style>

        /* =========================
           CONFIGURACIÓN GENERAL
        ========================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #ffd6e7,
                #fff0f6,
                #ffc8dd
            );

            overflow: hidden;
        }


        /* =========================
           CAJA PRINCIPAL
        ========================= */

        .caja {
            background: white;

            width: 90%;
            max-width: 600px;

            padding: 45px 30px;

            border-radius: 30px;

            text-align: center;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.15);

            position: relative;

            z-index: 10;
        }


        /* =========================
           TÍTULO
        ========================= */

        h1 {
            color: #d63384;

            font-size: 38px;

            margin-top: 0;
            margin-bottom: 20px;
        }


        /* =========================
           TEXTO
        ========================= */

        p {
            color: #6b3150;

            font-size: 20px;
        }


        /* =========================
           BOTONES
        ========================= */

        .botones {
            margin-top: 30px;

            display: flex;

            justify-content: center;

            gap: 15px;
        }


        button {
            border: none;

            padding: 15px 25px;

            border-radius: 30px;

            font-size: 18px;

            cursor: pointer;

            transition: 0.2s;
        }


        /* BOTÓN SÍ */

        #si {
            background-color: #d63384;

            color: white;
        }


        #si:hover {
            transform: scale(1.1);

            background-color: #b51f6c;
        }


        /* BOTÓN NO */

        #no {
            background-color: #eeeeee;

            color: #555;

            position: relative;
        }


        /* =========================
           IMAGEN
        ========================= */

        #imagen {
            display: none;

            width: 300px;
            max-width: 100%;

            margin: 30px auto 0;

            border-radius: 25px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.2);

            animation: aparecer 1s ease;
        }


        /* =========================
           MENSAJE
        ========================= */

        #mensaje {
            display: none;

            color: #d63384;

            font-size: 25px;

            font-weight: bold;

            animation: aparecer 1s ease;
        }


        /* =========================
           ANIMACIÓN IMAGEN
        ========================= */

        @keyframes aparecer {

            from {
                opacity: 0;

                transform: scale(0.5);
            }

            to {
                opacity: 1;

                transform: scale(1);
            }

        }


        /* =========================
           CORAZONES
        ========================= */

        .corazon {

            position: fixed;

            bottom: -50px;

            font-size: 30px;

            animation: subir 4s linear forwards;

            pointer-events: none;

            z-index: 100;
        }


        @keyframes subir {

            0% {
                transform: translateY(0) rotate(0deg);

                opacity: 1;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);

                opacity: 0;
            }

        }


        /* =========================
           MÓVIL
        ========================= */

        @media (max-width: 600px) {

            h1 {
                font-size: 28px;
            }

            p {
                font-size: 18px;
            }

            .botones {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         CAJA PRINCIPAL
    ========================= -->

    <div class="caja">

        <h1>
            ¿Te gustaría quedar para vernos la carita? 
        </h1>


        <p>
            y igual con beso incluido, es buena ofertaaaaaa
        </p>


        <div class="botones">

            <button id="si" onclick="decirSi()">
                Sí, quiero
            </button>


            <button id="no" onmouseover="escapar()">
                No quiero 
            </button>

        </div>


        <!-- MENSAJE OCULTO -->

        <p id="mensaje">
            tooooomaya, lo di todo JAJAJA 
        </p>


        <!-- IMAGEN OCULTA -->

        <img
            id="imagen"
            src="fotito.jpg"
            alt="Nuestra foto"
            width="300"
        >

    </div>



    <script>


        /* =========================
           CUANDO PULSA "SÍ"
        ========================= */

        function decirSi() {

            // Mostrar mensaje

            document.getElementById("mensaje").style.display = "block";


            // Mostrar imagen

            document.getElementById("imagen").style.display = "block";


            // Crear muchos corazones

            for (let i = 0; i < 30; i++) {

                crearCorazon();

            }

        }



        /* =========================
           CREAR CORAZONES
        ========================= */

        function crearCorazon() {

            const corazon = document.createElement("div");

            corazon.classList.add("corazon");

           corazon.innerHTML = "🔥";


            // Posición horizontal aleatoria

            corazon.style.left =
                Math.random() * 100 + "vw";


            // Tamaño aleatorio

            corazon.style.fontSize =
                (20 + Math.random() * 30) + "px";


            // Duración aleatoria

            corazon.style.animationDuration =
                (3 + Math.random() * 3) + "s";


            document.body.appendChild(corazon);


            // Eliminar después de la animación

            setTimeout(function () {

                corazon.remove();

            }, 6000);

        }



        /* =========================
           BOTÓN "NO"
        ========================= */

        function escapar() {

            const boton =
                document.getElementById("no");


            const ancho =
                window.innerWidth - boton.offsetWidth - 20;


            const alto =
                window.innerHeight - boton.offsetHeight - 20;


            const nuevaX =
                Math.random() * ancho;


            const nuevaY =
                Math.random() * alto;


            boton.style.position = "fixed";

            boton.style.left = nuevaX + "px";

            boton.style.top = nuevaY + "px";

        }


    </script>

</body>

</html>
